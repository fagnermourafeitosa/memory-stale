[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-stale"
version = "0.1.0"
description = "Automatic, code-anchored memory maintenance for Codex."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "pyyaml>=6.0",
    "tree-sitter-language-pack>=1.14.3",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_stale"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PERF",
    "PTH",
    "RUF",
    "SIM",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["memory_stale"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["memory_stale"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
