  - id: graph-two-hop-policy
    family: evidence-graph
    label: changed
    initial_files: {auth.py: "def login():\n    return False\n", policy.py: "def policy():\n    return True\n", mfa.py: "def mfa():\n    return True\n"}
    capture_files: {auth.py: "def login():\n    return policy()\n", policy.py: "def policy():\n    return mfa()\n", mfa.py: "def mfa():\n    return True\n"}
    capture:
      kind: behavior
      claim: Login follows the transitive MFA policy.
      durability_reason: The login behavior depends on this explicit evidence graph.
      evidence:
        - type: symbol
          role: primary
          locator: auth.py:login
          depends_on:
            - type: symbol
              locator: policy.py:policy
              depends_on:
                - type: symbol
                  locator: mfa.py:mfa
    change_files: {auth.py: "def login():\n    return policy()\n", policy.py: "def policy():\n    return mfa()\n", mfa.py: "def mfa():\n    return False\n"}
    retrieval_prompt: auth.py:login
    expected_stale_reasons:
      symbol:mfa.py:mfa: changed via symbol:auth.py:login -> symbol:policy.py:policy -> symbol:mfa.py:mfa
  - id: repository-shape-deletion
    family: repository-shape
